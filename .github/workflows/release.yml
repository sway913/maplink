name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maplink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Test server
        working-directory: server
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build management UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build:static

  windows-client:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: windows-cargo-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Test client
        working-directory: client
        run: |
          npm ci
          npm test
          node --check ui/app.js
          node --check ui/vendor/xterm/xterm.js
          node --check ui/vendor/xterm/addon-fit.js

      - name: Test Rust client
        working-directory: client/src-tauri
        shell: bash
        run: |
          cargo fmt --check
          set +e
          cargo test --locked 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details="$(tail -n 120 cargo-test.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Cargo test failed::$details"
            exit "$status"
          fi

      - name: Resolve release metadata
        if: github.event_name != 'pull_request'
        id: release
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'client/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [string]$config.version
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "标签 ${{ github.ref_name }} 与应用版本 $tag 不一致"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build complete Windows packages
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./client/scripts/build-complete.ps1 -Version '${{ steps.release.outputs.version }}'

      - name: Smoke-test Windows packages
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./client/tests/package-smoke.ps1 -AppVersion '${{ steps.release.outputs.version }}'

      - name: Upload Windows package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MapLink-${{ steps.release.outputs.tag }}-windows-x64
          path: |
            dist/MapLink-Complete-Setup-${{ steps.release.outputs.tag }}-win64.exe
            dist/MapLink-Complete-${{ steps.release.outputs.tag }}-win64.zip
            dist/MapLink-${{ steps.release.outputs.tag }}-windows-x64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  macos-client:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: macos-arm64-cargo-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: macos-arm64-cargo-

      - name: Test client
        working-directory: client
        run: |
          npm ci
          npm test
          node --check ui/app.js
          node --check ui/vendor/xterm/xterm.js
          node --check ui/vendor/xterm/addon-fit.js

      - name: Test Rust client
        working-directory: client/src-tauri
        shell: bash
        run: |
          cargo fmt --check
          set +e
          cargo test --locked 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details="$(tail -n 120 cargo-test.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Cargo test failed::$details"
            exit "$status"
          fi

      - name: Resolve release metadata
        if: github.event_name != 'pull_request'
        id: release
        run: |
          version="$(node -p "require('./client/src-tauri/tauri.conf.json').version")"
          tag="v$version"
          if [[ '${{ github.ref_type }}' == 'tag' && '${{ github.ref_name }}' != "$tag" ]]; then
            echo "标签 ${{ github.ref_name }} 与应用版本 $tag 不一致" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build complete macOS Apple Silicon packages
        if: github.event_name != 'pull_request'
        run: ./client/scripts/build-macos.sh '${{ steps.release.outputs.version }}'

      - name: Smoke-test macOS packages
        if: github.event_name != 'pull_request'
        run: ./client/tests/package-smoke-macos.sh ./dist '${{ steps.release.outputs.version }}'

      - name: Upload macOS package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MapLink-${{ steps.release.outputs.tag }}-macos-arm64
          path: |
            dist/MapLink-${{ steps.release.outputs.tag }}-macos-arm64.dmg
            dist/MapLink-${{ steps.release.outputs.tag }}-macos-arm64.app.zip
            dist/MapLink-${{ steps.release.outputs.tag }}-macos-arm64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  cloud-e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Exercise the complete remote relay protocol
        working-directory: server
        run: go test ./internal/manager -run 'TestRemoteRelayAuthenticatesAndMovesFramesAndInputWithoutPersistence' -count=1 -v

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install browser E2E runtime
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run complete client connection E2E
        working-directory: client
        run: npm run test:e2e

  release:
    needs:
      - windows-client
      - macos-client
      - cloud-e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release metadata
        id: release
        run: |
          version="$(node -p "require('./client/src-tauri/tauri.conf.json').version")"
          tag="v$version"
          if [[ '${{ github.ref_type }}' == 'tag' && '${{ github.ref_name }}' != "$tag" ]]; then
            echo "标签 ${{ github.ref_name }} 与应用版本 $tag 不一致" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: MapLink-${{ steps.release.outputs.tag }}-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "6"
          max_package_bytes=$((200 * 1024 * 1024))
          for package in dist/*; do
            [[ "$package" == *SHA256SUMS.txt ]] && continue
            package_size="$(stat -c%s "$package")"
            (( package_size < max_package_bytes )) || { echo "发布包必须小于 200 MB：$package 当前为 $package_size 字节" >&2; exit 1; }
          done
          cd dist
          sha256sum -c MapLink-${{ steps.release.outputs.tag }}-windows-x64-SHA256SUMS.txt
          sha256sum -c MapLink-${{ steps.release.outputs.tag }}-macos-arm64-SHA256SUMS.txt

      - name: Create GitHub release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，本次构建包保留在 Actions Artifacts。"
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG" dist/*
            --repo '${{ github.repository }}'
            --title "映链 MapLink $RELEASE_TAG"
            --generate-notes
            --notes-file .github/release-preamble.md
          )
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target '${{ github.sha }}')
          fi
          gh "${release_args[@]}"
